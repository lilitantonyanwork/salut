<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Чекаут</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
    </header>

    <main>
        <section class="checkout">
            <div class="cart__head">
                <div class="back">
                    <a href="cart.html" class="back__btn" aria-label="Назад"></a>
                </div>
            </div>
            <h1 class="checkout__title">Способ получения заказа</h1>
            <div class="checkout__methods">
                <button type="button" class="method is-selected" data-method="counter">
                    <span class="method__head">
                        <span class="method__name">Стойка</span>
                       <svg class="method__icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <path d="M20.5625 3.5H7.4375C5.26663 3.5 3.5 5.26663 3.5 7.4375V10.0625C3.5 12.2334 5.26663 14 7.4375 14H20.5625C22.7334 14 24.5 12.2334 24.5 10.0625V7.4375C24.5 5.26663 22.7334 3.5 20.5625 3.5ZM5.25 7.4375C5.25 6.23088 6.23088 5.25 7.4375 5.25H11.1799C11.4826 5.77063 12.0409 6.125 12.6875 6.125H15.3125C15.9583 6.125 16.5165 5.77063 16.8201 5.25H20.5625C21.7691 5.25 22.75 6.23088 22.75 7.4375V7.875H5.25V7.4375ZM20.5625 12.25H7.4375C6.23088 12.25 5.25 11.2691 5.25 10.0625V9.625H11.1799C11.4826 10.1456 12.0409 10.5 12.6875 10.5H15.3125C15.9583 10.5 16.5165 10.1456 16.8201 9.625H22.75V10.0625C22.75 11.2691 21.7691 12.25 20.5625 12.25ZM24.5 23.625C24.5 24.1089 24.1089 24.5 23.625 24.5C23.1411 24.5 22.75 24.1089 22.75 23.625C22.75 20.2484 20.0016 17.5 16.625 17.5H13.125C12.642 17.5 12.25 17.892 12.25 18.375C12.25 18.858 12.642 19.25 13.125 19.25H16.625C17.1089 19.25 17.5 19.6411 17.5 20.125C17.5 20.6089 17.1089 21 16.625 21H12.8923C12.0085 21 11.1563 20.7366 10.4274 20.2396L6.5625 17.6041C6.20025 17.3766 5.59913 17.5236 5.38213 17.9191C5.13013 18.3313 5.257 18.8738 5.6665 19.1301L9.27413 21.5679C10.5061 22.3405 11.9534 22.7561 13.4374 22.7561C13.4864 22.7561 16.5769 22.7491 16.625 22.7491C17.108 22.7491 17.4991 23.1394 17.5 23.6224C17.5009 24.1054 17.1106 24.4983 16.6268 24.4991C16.583 24.4991 13.4768 24.5061 13.4365 24.5061C11.6244 24.5061 9.85513 23.9977 8.3195 23.0326L4.71275 20.5958C3.51925 19.8503 3.13862 18.2324 3.88938 17.0065C4.60338 15.7832 6.32188 15.3702 7.51275 16.1359L10.5193 18.1851C10.619 16.828 11.7425 15.7509 13.125 15.7509H16.625C20.9676 15.7509 24.5 19.2824 24.5 23.625Z" fill="#597DF0"/>
                    </svg>
                    </span>
                    <span class="method__value">2go</span>
                    <span class="method__text">Заберите свой заказ на кассе</span>
                </button>
                <button type="button" class="method" data-method="table">
                    <span class="method__head">
                        <span class="method__name">Стол</span>

                        <svg class="method__icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
                         <path d="M21.4375 21.875C21.4375 22.3589 21.0455 22.75 20.5625 22.75H3.9375C3.4545 22.75 3.0625 22.3589 3.0625 21.875C3.0625 21.3911 3.4545 21 3.9375 21H20.5625C21.0455 21 21.4375 21.3911 21.4375 21.875ZM24.0625 10.9375V12.6875C24.0625 14.3763 22.6888 15.75 21 15.75H19.5991C19.1923 17.7441 17.4248 19.25 15.3125 19.25H9.1875C6.77513 19.25 4.8125 17.2874 4.8125 14.875V7.875C4.8125 6.42775 5.99025 5.25 7.4375 5.25H17.0625C18.5098 5.25 19.6875 6.42775 19.6875 7.875H21C22.6888 7.875 24.0625 9.24875 24.0625 10.9375ZM10.3189 10.6059C10.1561 10.7695 10.0625 10.9944 10.0625 11.2245V12.6875C10.0625 12.9281 10.2585 13.125 10.5 13.125H11.375C11.6165 13.125 11.8125 12.9281 11.8125 12.6875V11.2245C11.8125 10.9944 11.7189 10.7686 11.5561 10.6059L10.9375 9.98725L10.3189 10.6059ZM17.9375 7.875C17.9375 7.392 17.5446 7 17.0625 7H11.8125V8.38775L12.7934 9.36863C13.2895 9.86388 13.5625 10.5236 13.5625 11.2245V12.6875C13.5625 13.8941 12.5808 14.875 11.375 14.875H10.5C9.29425 14.875 8.3125 13.8941 8.3125 12.6875V11.2245C8.3125 10.5236 8.5855 9.86388 9.08163 9.36863L10.0625 8.38775V7H7.4375C6.95538 7 6.5625 7.392 6.5625 7.875V14.875C6.5625 16.3223 7.74025 17.5 9.1875 17.5H15.3125C16.7598 17.5 17.9375 16.3223 17.9375 14.875V7.875ZM22.3125 10.9375C22.3125 10.2139 21.7236 9.625 21 9.625H19.6875V14H21C21.7236 14 22.3125 13.4111 22.3125 12.6875V10.9375Z" fill="#597DF0"/>
                        </svg>
                                            </span>
                    <span class="method__value" id="table-number">2</span>
                    <span class="method__text">Ожидайте свой заказ за столом</span>
                </button>
            </div>
            <button type="button" class="checkout__change" id="change-table">
                Изменить номер стола
                <svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                    <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </section>
    </main>
    <footer>
        <div class="cart__total">5 430 ₽</div>
        <a  href="order.html" class="btn btn__cart">
            Оплатить
        </a>
    </footer>

    <div class="modal modal--table" id="modal-table">
        <div class="modal__content">
            <div class="table-sheet__head">
                <p>Введите номер с наклейки на вашем столе</p>
                <button type="button" class="btn btn__close" id="table-close" aria-label="Закрыть"></button>
            </div>
            <div class="table-field" id="table-field">
                <span class="table-field__error" id="table-error">Такого стола нет</span>
                <div class="table-field__row">
                    <label class="table-field__text is-placeholder" for="table-caret" id="table-text">Номер стола</label>
                    <input type="number" class="table-field__caret" id="table-caret" min="1">
                </div>
            </div>
            <button type="button" class="btn btn__done" id="table-done">Готово</button>
     
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
