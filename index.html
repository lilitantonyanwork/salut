<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main>
        <section class="welcome">
                <div class="welcome__content">
                    <div class="welcome__slider swiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide">
                                <div class="welcome__slider--img">
                                    <img src="img/welcome1.png" alt="welcome1">
                                </div>
                                <div class="welcome__slider-content">
                                    <h1 class="welcome__title">Salut! <br> Coffee?</h1>
                                    <p class="welcome__text">Первомайская, 1а</p>
                                    <a href="listing.html" class="btn btn__menu">Меню</a>
                                </div>
                            </div>
                            <div class="swiper-slide">
                                <div class="welcome__slider--img">
                                    <img src="img/welcome2.png" alt="welcome1">
                                </div>
                                <div class="welcome__slider-content">
                                    <h1 class="welcome__title">Чайная <br> Салют</h1>
                                    <p class="welcome__text">Осипенко, 21а</p>
                                    <p class="coming">Скоро открытие</p>
                                </div>
                            </div>
                        </div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                    </div>
                </div>
                <div class="welcome__footer">
                    <img src="img/logo.svg" alt="logo">
                </div>

        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
