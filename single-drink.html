<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Title</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="single">
    <header>
    </header>

    <main>
       <section class="product">

               <div class="product__features--head">
                   <div class="back">
                       <a href="listing.html" class="back__btn">
                       </a>
                   </div>

                   <div class="header__title">
                       <h2>Чай листовой</h2>
                       <button class="btn btn__info"></button>
                   </div>
               </div>
           <div class="product__features">
               <div class="product__features--info">
                   <p>Шакшука — яйца, томлённые в пряном соусе из спелых томатов, сладкого перца и специй. Подаётся горячей со свежей зеленью и хлебом.</p>
               </div>
               <img src="img/0e1c9286cd63d062298ba1f60cda0ad4bf8073ff.jpg" alt="0e1c9286cd63d062298ba1f60cda0ad4bf8073ff.jpg">
               <div class="product__features--bottom">
                   <div class="size selected">
                       <span>М</span>
                       300 мл
                   </div>
                   <div class="size">
                       <span>L</span>
                       450 мл
                   </div>

               </div>
           </div>
           <div class="modificators">
               <h3 class="section__title">Модификаторы</h3>
               <div class="modificator__tab">
                   <button class="btn btn__type selected" data-id="green">Зеленый чай</button>
                   <button class="btn btn__type" data-id="black">Черный чай</button>
               </div>
               <div class="modificator__list open" id="green">
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/Picture (1).png" alt="Picture (1).png">
                       <h4>Чай малина</h4>
                   </div>
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/Picture (2).png" alt="Picture (2).png">
                       <h4>Чай улун</h4>
                   </div>
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/55929b00eff9ad2ab5c0d95f01340f15cb5a3279.png" alt="55929b00eff9ad2ab5c0d95f01340f15cb5a3279.png">
                       <h4>Чай горный</h4>
                   </div>
               </div>
               <div class="modificator__list " id="black">
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/Picture (1).png" alt="Picture (1).png">
                       <h4>Чай малина</h4>

                   </div>
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/Picture (2).png" alt="Picture (2).png">
                       <h4>Чай улун</h4>
                   </div>
                   <div class="modificator__item modificator__item--drink">
                       <img src="img/55929b00eff9ad2ab5c0d95f01340f15cb5a3279.png" alt="55929b00eff9ad2ab5c0d95f01340f15cb5a3279.png">
                       <h4>Чай горный</h4>
                   </div>
               </div>
           </div>
           <div class="price">
               500 ₽
           </div>
       </section>

    </main>
    <footer>
        <a  href="" class="btn btn__cart">
            Добавить
        </a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
