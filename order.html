    <div class="modal modal--receipt" id="modal-receipt">

            <div class="receipt__head">
                <h2>Куда отправить чек?</h2>
                <button type="button" class="btn btn__close" id="receipt-close" aria-label="Закрыть"></button>
            </div>
            <div class="table-field__row">
                <label class="table-field__text is-placeholder" for="receipt-email" id="table-text">Email</label>
                <input class="receipt__input" id="receipt-email" type="email" placeholder="" autocomplete="email">

            </div>

            <button type="button" class="btn btn__done" id="receipt-done">Готово</button>
        </div>
